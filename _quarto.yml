# ---------------------------------------------------------------------------
# Project-wide Quarto configuration — a *book* project.
#
# Same technical setup as the Creative Coding books (ddp-second): the files
# under `book.chapters` are stitched into ONE ordered document and rendered as
#   * html -> a book-style website (chapter sidebar + prev/next navigation)
#   * pdf  -> ONE combined PDF, each `# Kapitel` starting on its own page
#
# Chapters live in numbered folders (0010-einstieg/, 0020-stablecoins/) and
# are grouped into book parts below.
# ---------------------------------------------------------------------------

project:
  type: book
  output-dir: _output    # rendered book + PDF land here (git-ignored)

# German UI strings (table of contents, callout titles, "Download PDF", ...).
lang: de

book:
  title: "Stablecoins"
  subtitle: "Digitale Dollar und die Weltwirtschaft: ein Novedu-Beispiel für den Wirtschaftskundeunterricht"
  author: "Rainer Stropek"
  date: 2026-09-16
  # Base name of the PDF: `_output/book.pdf`, which GitHub Pages serves at
  # /book.pdf (see .github/workflows/build.yml).
  output-file: book
  downloads: [pdf]      # "PDF herunterladen" button in the HTML book's sidebar
  site-url: https://general-stuff.github.io/novedu-stablecoins-sample/
  repo-url: https://github.com/general-stuff/novedu-stablecoins-sample
  chapters:
    - index.qmd
    - part: "Bevor es losgeht"
      chapters:
        - 0010-einstieg/0010-dein-tutor.qmd
    - part: "Stablecoins"
      chapters:
        - 0020-stablecoins/0010-was-ist-ein-stablecoin.qmd
        - 0020-stablecoins/0020-wenn-das-versprechen-bricht.qmd
        - 0020-stablecoins/0030-stablecoins-und-die-weltwirtschaft.qmd
  page-footer:
    left: "© 2026 — Stablecoins: ein Novedu-Beispiel"
    right: "Erstellt mit [Quarto](https://quarto.org)"

# Base URL of the Novedu chat app. The `quiz`, `tutor`, and `writing`
# shortcodes turn an activity code into a link built from this base
# (<base>/<code>). If the app ever moves, edit ONLY this line.
novedu-base-url: "https://novedu.at"

# The generated key -> code map for every Novedu activity this book links to.
# A chapter names an activity by its registry KEY ({{< quiz
# was-ist-ein-stablecoin >}}) and the shortcode looks that key up in the
# `activity-codes` map contributed here.
# stablecoins-activities.yaml is hand-written, stablecoins-activities.lock.yaml
# is regenerated by `novedu-cli codes sync stablecoins-activities.yaml`; both
# are committed (README).
metadata-files:
  - stablecoins-activities.lock.yaml

# Project-wide Pandoc/Lua filters. emoji-pdf.lua replaces emoji with plain
# words in PDF output only — the PDF fonts have no emoji glyphs.
filters:
  - emoji-pdf.lua

# --- Output formats --------------------------------------------------------
format:
  html:
    theme: cosmo         # one of Quarto's built-in Bootstrap themes
    css: styles.css      # our small custom stylesheet
    smooth-scroll: true
    link-external-newwindow: true  # external links open in a new tab
    link-external-icon: true       # + a small "leaves the site" icon

  pdf:
    # A book uses a *chapter*-aware class. scrreprt (KOMA report) gives each
    # top-level chapter its own page without the heavier front-matter of a
    # full scrbook — a good fit for classroom handouts.
    documentclass: scrreprt
    papersize: a4
    fontsize: 10pt
    linestretch: 1.1
    geometry:
      - top=18mm
      - bottom=20mm
      - left=20mm
      - right=20mm
      - footskip=11mm
    toc-depth: 1              # TOC shows parts + chapters only, not `##` sections
    number-sections: true
    colorlinks: true
    linkcolor: tsblue
    urlcolor: tsblue
    highlight-style: github
    code-block-bg: true
    # The second entry, pdf-compact.tex, holds the print layout (spacing around
    # headings, lists, code blocks, callouts and figures) — see that file.
    include-in-header:
      - text: |
          \definecolor{tsblue}{HTML}{3178C6}
          % scrreprt numbers parts with Roman numerals by default (Part I);
          % switch to arabic so it reads "Teil 1".
          \renewcommand*{\thepart}{\arabic{part}}
          % Number chapters *within* their part: 1.1, 1.2, ... 2.1, ...
          \counterwithin{chapter}{part}
          % Don't bold chapter entries in the table of contents.
          \setkomafont{chapterentry}{\normalfont}
          \DeclareTOCStyleEntry[numwidth=3em,beforeskip=0pt]{tocline}{chapter}
      - file: pdf-compact.tex
